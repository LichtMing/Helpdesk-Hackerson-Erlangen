services:

  backend:
    build:
      context: .                      # root — so both ApiGateway/ and BE/ are in scope
      dockerfile: ApiGateway/Dockerfile
    container_name: acu-backend
    ports:
      - "3000:3000"
    volumes:
      - acu-data:/data                # persists devices.json & workflows.json across restarts
    environment:
      - DataPath=/data/devices.json
      - WorkflowDataPath=/data/workflows.json
      - RobotWorkflowDataPath=/data/robot-workflows.json
      - AcuSettingsDataPath=/data/acu-settings.json
      - Conversation__EnableDevelopmentResponses=true
      - Conversation__SessionIdleTimeoutMinutes=5
      - Conversation__MaxTurns=6
      - Tts__Enabled=true
      - Tts__Executable=espeak-ng
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:3000   # override appsettings so the container listens on all interfaces
    restart: unless-stopped

  frontend:
    build:
      context: ./ACU.FE
      dockerfile: Dockerfile
    container_name: acu-frontend
    ports:
      - "3100:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Internal AI boundary. It is intentionally not published to the host: the
  # robot must use the .NET gateway on port 3000. The current implementation
  # is still a placeholder and is not wired into IChatModelClient yet.
  helpdesk-api:
    profiles: ["ai"]
    build:
      context: ../..
      dockerfile: helpdesk_api/Dockerfile
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b-instruct
    expose:
      - "8000"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # Optional local-development model runtime. Models live in a named volume
  # and are never committed to Git. Do not enable this profile on the 4 GB
  # target ACU until the final storage budget has been validated.
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.40.8
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mdns:
    profiles: ["lan"]
    build:
      context: .                      # root — MdnsAdvertiser.csproj lives under BE/
      dockerfile: BE/MdnsAdvertiser/Dockerfile
    container_name: acu-mdns
    network_mode: host               # required so multicast reaches the real LAN (Linux hosts only)
    environment:
      - MDNS_PORT=3000
      - MDNS_NAME=ACU Control Center
    restart: unless-stopped

volumes:
  acu-data:
  ollama-data:
