services:

  backend:
    image: acu-backend:local
    build:
      context: .                      # root — so both ApiGateway/ and BE/ are in scope
      dockerfile: ApiGateway/Dockerfile
    container_name: acu-backend
    ports:
      - "3000:3000"
    volumes:
      - acu-data:/data                # persists devices.json & workflows.json across restarts
      - piper-models:/models:ro       # persisted Piper ONNX voices
    environment:
      - DataPath=/data/devices.json
      - WorkflowDataPath=/data/workflows.json
      - RobotWorkflowDataPath=/data/robot-workflows.json
      - AcuSettingsDataPath=/data/acu-settings.json
      - Conversation__EnableDevelopmentResponses=false
      - Conversation__SessionIdleTimeoutMinutes=5
      - Conversation__MaxTurns=6
      - Helpdesk__Enabled=true
      - Helpdesk__BaseUrl=http://helpdesk-api:8000
      # Keep the outer gateway timeout above the Ollama timeout so the
      # adapter can return a useful 503 after a slow cold start.
      - Helpdesk__TimeoutSeconds=150
      - Tts__Enabled=true
      - Tts__Provider=Piper
      - Tts__PiperExecutable=python3
      - Tts__PiperScript=/app/piper_synthesize.py
      - Tts__ModelDirectory=/models
      - Tts__EnglishVoice=en_US-lessac-medium
      - Tts__GermanVoice=de_DE-thorsten-medium
      - Tts__ChineseVoice=zh_CN-huayan-medium
      - Tts__LengthScale=1.0
      - Tts__SentenceSilenceSeconds=0.15
      - Tts__TimeoutSeconds=60
      - Tts__Executable=espeak-ng
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
      - CommunicationLogging__IncludeText=true
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:3000   # override appsettings so the container listens on all interfaces
    depends_on:
      piper-model-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot download into a named volume. Existing verified voice files are
  # reused on later starts and are never committed to Git.
  piper-model-init:
    image: acu-backend:local
    pull_policy: never
    entrypoint: ["python3", "/app/prepare_piper_voices.py", "--data-dir", "/models"]
    command:
      - en_US-lessac-medium
      - de_DE-thorsten-medium
      - zh_CN-huayan-medium
    volumes:
      - piper-models:/models
    restart: "no"

  # The operator dashboard is preserved, but it is not part of the default
  # headless ACU runtime. Start it explicitly with --profile dashboard.
  frontend:
    profiles: ["dashboard"]
    build:
      context: ./ACU.FE
      dockerfile: Dockerfile
    container_name: acu-frontend
    ports:
      - "3100:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Internal text-only AI boundary. It is part of the default headless server.
  # The robot sends recognized text; raw microphone audio never enters it.
  helpdesk-api:
    build:
      context: ../..
      dockerfile: helpdesk_api/Dockerfile
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=ct-robot
      # Qwen may need longer than 45 seconds when Ollama reloads it after idle.
      - OLLAMA_TIMEOUT_SECONDS=120
      - GATEWAY_URL=http://backend:3000
      - ROBOT_DEVICE_ID=auto
      - WORKFLOW_ID=erlangen-helpdesk-answer
    expose:
      - "8000"
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Local Qwen runtime. Models live in a named volume and are never committed.
  ollama:
    image: ollama/ollama:0.40.8
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama-model-init:
    image: ollama/ollama:0.40.8
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./Modelfile.txt:/model/Modelfile:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama create ct-robot -f /model/Modelfile"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  mdns:
    profiles: ["lan"]
    build:
      context: .                      # root — MdnsAdvertiser.csproj lives under BE/
      dockerfile: BE/MdnsAdvertiser/Dockerfile
    container_name: acu-mdns
    network_mode: host               # required so multicast reaches the real LAN (Linux hosts only)
    environment:
      - MDNS_PORT=3000
      - MDNS_NAME=ACU Control Center
    restart: unless-stopped

volumes:
  acu-data:
  ollama-data:
  piper-models:
